apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: nms
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nms
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer than the current replicas during a rollout: an upgrade must
      # not be the reason nobody was paged.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nms
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Restarts the pods when configuration changes, which a ConfigMap
        # update alone would not do.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "nms.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long enough to drain in-flight checks and flush the history buffer, so
      # a rollout does not discard the last seconds of collection.
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      containers:
        - name: server
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}-server:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: NMS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretPasswordKey }}
            - name: NMS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  # Shared by every replica. A per-pod secret would mean a
                  # token minted by one pod is rejected by the next.
                  name: {{ required "security.existingSecret is required" .Values.security.existingSecret }}
                  key: jwt-secret
            - name: NMS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.existingSecret }}
                  key: admin-password
                  # Absent on purpose is allowed: the server then generates one
                  # and prints it once.
                  optional: true
          # Answers before the database is reachable, so a pod waiting on a slow
          # managed database is not killed and restarted forever.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          # Readiness includes the database, so a pod that has lost it is taken
          # out of the load balancer without being restarted -- restarting would
          # not fix a database outage and would lose its buffered history.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only, so the JVM's scratch space has
            # to be an explicit writable mount.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        # Spread replicas across nodes where possible, so one node failing does
        # not take the monitoring down with whatever else it was running.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nms
                    app.kubernetes.io/component: server
                    app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: nms
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: nms
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.server.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-server
  minReplicas: {{ .Values.server.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.server.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.server.autoscaling.targetMemoryUtilizationPercentage }}
  behavior:
    scaleDown:
      # Slow to scale down. Each replica holds a share of the poller queue, and
      # removing one mid-cycle hands its claimed items back to be re-polled.
      stabilizationWindowSeconds: 600
{{- end }}
{{- if .Values.server.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-server
spec:
  minAvailable: {{ .Values.server.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nms
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
