<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Inline rather than a file: without any icon the browser requests
      /favicon.ico unprompted, gets a 404, and logs a console error on every
      page load. That is noise in the one place a real fault would show up.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1a18'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230ca30c'/%3E%3C/svg%3E"
    />
    <title>Network Monitoring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
